kind: Pod
apiVersion: v1
metadata:
  name: pod-1
  labels:
    purpose: test
spec:
  containers:
  - name: nginx
    image: nginx
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-2
spec:
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
          - key: "purpose"
            operator: In
            values:
            - dev
        topologyKey: topology.kubernetes.io/zone
  containers:
  - name: with-pod-affinity
    image: registry.k8s.io/pause:3.8
  tolerations:
  - key: "project"
    operator: "Exists"
    effect: "NoSchedule"