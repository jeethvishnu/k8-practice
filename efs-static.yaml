apiVersion: v1
kind: PersistentVolume
metadata:
  name: efs-static
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: efs.csi.aws.com
    volumeHandle: fs-0d6c67b67f4a0cfa3
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: efs-static-cliam
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: efs-static
  resources:
    requests:
      storage: 3Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: efs-static-pod
  labels:
    name: efs
spec:
  containers:
  - name: app
    image: nginx
    volumeMounts:
    - name: persistent-storage
      mountPath: /usr/share/nginx/html
  volumes:
  - name: persistent-storage
    persistentVolumeClaim:
      claimName: efs-static-cliam
---
kind: Service
apiVersion: v1
metadata:
  name: svc
spec:
  selector:
    purpose: efs
  ports:
    - protocol: TCP
      port: 80
      targetPort: 30002