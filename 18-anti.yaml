kind: Pod
apiVersion: v1
metadata:
  name: pod-1
  labels:
    name: pod-1
spec:
  containers:
  - name: nginx
    image: nginx
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-2
spec:
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
          - key: name
            operator: In
            values:
            - pod-1
        topologyKey: topology.kubernetes.io/zone
  containers:
  - name: with-pod-affinity
    image: registry.k8s.io/pause:3.8
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-3
  labels:
    name: pod-3
spec:
  affinity:
    podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: name
                  operator: In
                  values:
                  - pod-2
              topologyKey: topology.kubernetes.io/zone
  containers:
  - name: nginx
    image: nginx
      # tolerations:
      # - key: "project"
      #   operator: "Exists"
      #   effect: "NoSchedule"