apiVersion: v1
kind: Pod
metadata:
  name: node-affinity
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: "purpose"
            operator: In
            values:
            - dev
  containers:
  - name: nginx
    image: nginx

  tolerations:
  - key: "project"
    operator: "Exists"
    effect: "NoSchedule"